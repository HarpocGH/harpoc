# Backend fleet for the E2E evaluation harness.
# Ports are offset into 55xxx and bound to loopback so a developer's own
# database is never reached — a green run must come from this fleet.
name: harpoc-e2e

services:
  postgres-tls:
    image: postgres:16
    user: root
    environment:
      POSTGRES_USER: harpoc
      POSTGRES_PASSWORD: harpoc-e2e-pw
      POSTGRES_DB: app
    volumes:
      - ./fixtures/pki/out:/pki:ro
    # PostgreSQL refuses a key file that is group- or world-readable, and a
    # bind mount carries the host's ownership. Copy it to a private path with
    # the right mode, then hand off to the official entrypoint, which drops
    # privileges itself.
    #
    # List form with a uniformly indented ">-" scalar, deliberately: in a folded
    # scalar, MORE-indented continuation lines keep their literal newlines, and
    # a newline after "exec ... postgres" hands the server ZERO flags — run
    # 31534116926 started this container without TLS that way. Keep every line
    # of the script at the same indentation so folding joins them with spaces.
    command:
      - bash
      - -c
      - >-
        install -o postgres -g postgres -m 600 /pki/postgres-tls.key /etc/pg-server.key &&
        install -o postgres -g postgres -m 644 /pki/postgres-tls.crt /etc/pg-server.crt &&
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/etc/pg-server.crt
        -c ssl_key_file=/etc/pg-server.key
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harpoc -d app"]
      interval: 2s
      timeout: 5s
      retries: 45

  postgres-plain:
    image: postgres:16
    environment:
      POSTGRES_USER: harpoc
      POSTGRES_PASSWORD: harpoc-e2e-pw
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harpoc -d app"]
      interval: 2s
      timeout: 5s
      retries: 45

  mysql-tls:
    image: mysql:8.4
    user: root
    environment:
      MYSQL_ROOT_PASSWORD: harpoc-e2e-root
      MYSQL_USER: harpoc
      MYSQL_PASSWORD: harpoc-e2e-pw
      MYSQL_DATABASE: app
    volumes:
      - ./fixtures/pki/out:/pki:ro
    # Same folding rule as postgres-tls: equal indentation or the flags after
    # "exec ... mysqld" become dead text and the server runs on its
    # auto-generated certificates.
    command:
      - bash
      - -c
      - >-
        install -o mysql -g mysql -m 600 /pki/mysql-tls.key /etc/mysql-server.key &&
        install -o mysql -g mysql -m 644 /pki/mysql-tls.crt /etc/mysql-server.crt &&
        install -o mysql -g mysql -m 644 /pki/ca.crt /etc/mysql-ca.crt &&
        exec docker-entrypoint.sh mysqld
        --require_secure_transport=ON
        --ssl-ca=/etc/mysql-ca.crt
        --ssl-cert=/etc/mysql-server.crt
        --ssl-key=/etc/mysql-server.key
    ports:
      - "127.0.0.1:55306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pharpoc-e2e-root --silent"]
      interval: 3s
      timeout: 5s
      retries: 45

  # sshd-pinned serves both the `ssh` context and git-over-ssh. Published on the
  # loopback ALIAS 127.0.0.2:22 because the host still forbids ":" in an
  # SshAction host, so the two sshd containers cannot share one address — each
  # takes a distinct 127.x. Since D59 the pinned server is also published on
  # 127.0.0.1:55022 for the non-22 `port` arm.
  # Stock macOS configures only 127.0.0.1 on lo0: fleet:up's preflight
  # (scripts/fleet-preflight.mjs) fails loudly with the `sudo ifconfig lo0
  # alias` recovery before this bind can take the whole bring-up down.
  sshd-pinned:
    build:
      context: ./fixtures/sshd
    image: harpoc-e2e-sshd
    volumes:
      - ./fixtures/keys/out/hostkey_pinned_ed25519:/hostkey:ro
      - ./fixtures/keys/out/authorized_keys:/authorized_keys:ro
      - ./fixtures/repos/out/clean.git:/srv-src/repo.git:ro
    # Same folding rule as the database services: uniform indentation so the
    # folded scalar joins the lines with spaces. A newline before a flag would
    # hand sshd dead text.
    command:
      - bash
      - -c
      - >-
        install -o root -g root -m 600 /hostkey /etc/ssh/ssh_host_ed25519_key &&
        install -D -o harpoc -g harpoc -m 600 /authorized_keys /home/harpoc/.ssh/authorized_keys &&
        rm -rf /srv/repo.git &&
        cp -r /srv-src/repo.git /srv/repo.git &&
        chown -R harpoc:harpoc /srv &&
        exec /usr/sbin/sshd -D -e -p 2222 -o UsePAM=no -o PasswordAuthentication=no
    ports:
      - "127.0.0.2:22:2222"
      - "127.0.0.1:55022:2222"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/2222"]
      interval: 2s
      timeout: 5s
      retries: 45

  # sshd-rogue answers at a DIFFERENT loopback alias with a DIFFERENT host key.
  # The mismatch arm pins the pinned server's key but connects here, so rogue's
  # real key fails host-key verification (no TOFU). Reuses the pinned image;
  # pull_policy:never keeps compose from trying to fetch the local-only tag.
  #
  # It also serves the repository, since Phase 4B: it doubles as the ATTACKER
  # SSH host for the git-over-ssh remote-rewrite arm (D4 — reuse fleet capacity
  # rather than add a third sshd). A successful clone from here is an
  # unambiguous observable for the baseline half of that paired row; without the
  # repository the arm would have to infer authentication from the shape of an
  # error message.
  sshd-rogue:
    image: harpoc-e2e-sshd
    pull_policy: never
    volumes:
      - ./fixtures/keys/out/hostkey_rogue_ed25519:/hostkey:ro
      - ./fixtures/keys/out/authorized_keys:/authorized_keys:ro
      - ./fixtures/repos/out/clean.git:/srv-src/repo.git:ro
    command:
      - bash
      - -c
      - >-
        install -o root -g root -m 600 /hostkey /etc/ssh/ssh_host_ed25519_key &&
        install -D -o harpoc -g harpoc -m 600 /authorized_keys /home/harpoc/.ssh/authorized_keys &&
        rm -rf /srv/repo.git &&
        cp -r /srv-src/repo.git /srv/repo.git &&
        chown -R harpoc:harpoc /srv &&
        exec /usr/sbin/sshd -D -e -p 2222 -o UsePAM=no -o PasswordAuthentication=no
    ports:
      - "127.0.0.3:22:2222"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/2222"]
      interval: 2s
      timeout: 5s
      retries: 45

  # TLS echo backend for the `http` context's demonstration cell — the first
  # real TLS handshake on the http path (until Phase 3 only the database arms
  # shook hands). Reflects the injected credential in several encodings, in the
  # body and in a response header, so a clean caller-visible result proves the
  # vault redacted rather than that the backend never saw the credential.
  # Phase 4's response-channel-echo scenario reuses this service.
  echo-https:
    build:
      context: ./fixtures/echo-https
    image: harpoc-e2e-echo-https
    volumes:
      - ./fixtures/pki/out:/pki:ro
    ports:
      - "127.0.0.1:55443:8443"
    # No bash in the alpine image: probe the port with node itself.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:net').connect(8443,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 45

  # Downstream MCP server over Streamable HTTP — the `mcp` context's target for
  # the http-transport variant (D10). Its `reveal` tool reflects the
  # Authorization the vault injected, and /recorded lets the harness confirm
  # out of band that the downstream really received the credential while the
  # caller-visible result stayed clean. Plain loopback HTTP: a supported vault
  # target (url-validator permits loopback http), and MCP-over-TLS trust would
  # ride the same NODE_EXTRA_CA_CERTS lever the http context already proves.
  mcp-downstream:
    build:
      context: ./fixtures/mcp-downstream
    image: harpoc-e2e-mcp-downstream
    ports:
      - "127.0.0.1:55090:8090"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:net').connect(8090,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 45

  # Tool-poisoning server (§6.2.3): a real MCP server whose tool DESCRIPTION
  # carries the injection naming the attacker endpoint. Its own image rather
  # than a mode of mcp-downstream — that service is a Phase 3 demonstration
  # target, and an attack fixture must not be able to change how a
  # demonstration cell behaves.
  mcp-poisoned:
    build:
      context: ./fixtures/mcp-poisoned
    image: harpoc-e2e-mcp-poisoned
    ports:
      - "127.0.0.1:55091:8091"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:net').connect(8091,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 45

  # git smart-HTTP over loopback with basic auth (D2: no TLS on the git path —
  # criterion 3's handshake is the database services' job; the git arms test
  # redirect refusal, submodule denial and askpass host-binding, none of which
  # need TLS). Repos are copied out of the read-only mount and handed to www-data.
  git-http:
    build:
      context: ./fixtures/git-http
    image: harpoc-e2e-git-http
    volumes:
      - ./fixtures/repos/out:/srv-src:ro
    command:
      - bash
      - -c
      - >-
        rm -rf /srv/git &&
        cp -r /srv-src /srv/git &&
        chown -R www-data:www-data /srv/git &&
        exec apache2ctl -D FOREGROUND
    ports:
      - "127.0.0.1:55080:80"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/80"]
      interval: 2s
      timeout: 5s
      retries: 45

  # Exfiltration sink for the two-arm attack scenarios (C-3). The baseline arm
  # must genuinely move the credential off-box, or "baseline leaks / Harpoc
  # blocks" is an assertion rather than a comparison with a visible effect; the
  # Harpoc arm's discriminating check is that /recorded stayed empty. Served
  # over TLS with a fixture-CA certificate on purpose: a Harpoc refusal has to
  # come from the secret's URL allowlist, not from an unreachable host or an
  # untrusted certificate (P4-R3).
  attacker:
    build:
      context: ./fixtures/attacker
    image: harpoc-e2e-attacker
    volumes:
      - ./fixtures/pki/out:/pki:ro
    ports:
      - "127.0.0.1:55444:8444"
    # No bash in the alpine image: probe the port with node itself.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:net').connect(8444,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 45

  # ---------------------------------------------------------------------------
  # v1.3 extended-context backends (SMTP/IMAP mail, Redis, MongoDB, docker
  # registry). Added for the context-opacity scenarios; first exercised by a
  # full fleet run on 2026-08-24 (win32, all six paired arms matched their
  # pre-registration).
  # ---------------------------------------------------------------------------

  # SMTP + IMAP mail server for the smtp and imap contexts. A single Node
  # fixture serving SMTPS (465) and IMAPS (993) over the SAN-covered localhost
  # leaf the echo-https service already presents, so no new PKI leaf is
  # generated — trust rides the fixture CA via NODE_EXTRA_CA_CERTS, exactly like
  # the http and database TLS paths. The protocol subset is tailored to the
  # vault's in-house SMTP/IMAP clients (design §4.2); validated live by the
  # 2026-08-24 full fleet run (smtp/imap opacity arms green).
  mail:
    build:
      context: ./fixtures/mail
    image: harpoc-e2e-mail
    volumes:
      - ./fixtures/pki/out:/pki:ro
    ports:
      - "127.0.0.1:55465:8465"
      - "127.0.0.1:55993:8993"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:net').connect(8465,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 45

  # Redis for the database context's `redis` engine. Plaintext on loopback with
  # a password (the credential is genuinely exercised at AUTH); the opacity
  # claim is orthogonal to transport, and the secret's connection config sets
  # tls_mode: disable to match.
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "redis-e2e-pw"]
    ports:
      - "127.0.0.1:55379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis-e2e-pw", "ping"]
      interval: 2s
      timeout: 5s
      retries: 45

  # MongoDB for the database context's `mongodb` engine. Root credentials over
  # loopback plaintext, same reasoning as redis; `admin` is the authSource.
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: harpoc-mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo-e2e-pw
    ports:
      - "127.0.0.1:55017:27017"
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "--host", "127.0.0.1"]
      interval: 3s
      timeout: 5s
      retries: 45

  # A registry:2 for the docker-registry context, with htpasswd auth baked into
  # the image (fixtures/registry — the Task 14 rider): the vault spawns `docker`
  # and injects the credential through its credential helper, and with
  # anonymous access answering 401 a successful pull proves the helper was
  # genuinely consulted. The registry starts empty, so fleet:up seeds
  # `hello-world:latest` through scripts/seed-registry.mjs once the fleet is
  # healthy — the opacity arm's pull needs an image to succeed. The healthcheck
  # carries the credentials because /v2/ now answers 401 without them, which
  # busybox wget treats as a failure.
  registry:
    build:
      context: ./fixtures/registry
    image: harpoc-e2e-registry
    ports:
      - "127.0.0.1:55000:5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://harpoc-docker:docker-e2e-pw@127.0.0.1:5000/v2/ || exit 1",
        ]
      interval: 2s
      timeout: 5s
      retries: 45
