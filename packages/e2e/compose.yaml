# Backend fleet for the E2E evaluation harness.
# Ports are offset into 55xxx and bound to loopback so a developer's own
# database is never reached — a green run must come from this fleet.
name: harpoc-e2e

services:
  postgres-tls:
    image: postgres:16
    user: root
    environment:
      POSTGRES_USER: harpoc
      POSTGRES_PASSWORD: harpoc-e2e-pw
      POSTGRES_DB: app
    volumes:
      - ./fixtures/pki/out:/pki:ro
    # PostgreSQL refuses a key file that is group- or world-readable, and a
    # bind mount carries the host's ownership. Copy it to a private path with
    # the right mode, then hand off to the official entrypoint, which drops
    # privileges itself.
    #
    # List form with a uniformly indented ">-" scalar, deliberately: in a folded
    # scalar, MORE-indented continuation lines keep their literal newlines, and
    # a newline after "exec ... postgres" hands the server ZERO flags — run
    # 31534116926 started this container without TLS that way. Keep every line
    # of the script at the same indentation so folding joins them with spaces.
    command:
      - bash
      - -c
      - >-
        install -o postgres -g postgres -m 600 /pki/postgres-tls.key /etc/pg-server.key &&
        install -o postgres -g postgres -m 644 /pki/postgres-tls.crt /etc/pg-server.crt &&
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/etc/pg-server.crt
        -c ssl_key_file=/etc/pg-server.key
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harpoc -d app"]
      interval: 2s
      timeout: 5s
      retries: 45

  postgres-plain:
    image: postgres:16
    environment:
      POSTGRES_USER: harpoc
      POSTGRES_PASSWORD: harpoc-e2e-pw
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harpoc -d app"]
      interval: 2s
      timeout: 5s
      retries: 45

  mysql-tls:
    image: mysql:8.4
    user: root
    environment:
      MYSQL_ROOT_PASSWORD: harpoc-e2e-root
      MYSQL_USER: harpoc
      MYSQL_PASSWORD: harpoc-e2e-pw
      MYSQL_DATABASE: app
    volumes:
      - ./fixtures/pki/out:/pki:ro
    # Same folding rule as postgres-tls: equal indentation or the flags after
    # "exec ... mysqld" become dead text and the server runs on its
    # auto-generated certificates.
    command:
      - bash
      - -c
      - >-
        install -o mysql -g mysql -m 600 /pki/mysql-tls.key /etc/mysql-server.key &&
        install -o mysql -g mysql -m 644 /pki/mysql-tls.crt /etc/mysql-server.crt &&
        install -o mysql -g mysql -m 644 /pki/ca.crt /etc/mysql-ca.crt &&
        exec docker-entrypoint.sh mysqld
        --require_secure_transport=ON
        --ssl-ca=/etc/mysql-ca.crt
        --ssl-cert=/etc/mysql-server.crt
        --ssl-key=/etc/mysql-server.key
    ports:
      - "127.0.0.1:55306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pharpoc-e2e-root --silent"]
      interval: 3s
      timeout: 5s
      retries: 45

  # sshd-pinned serves both the `ssh` context and git-over-ssh. Published on the
  # loopback ALIAS 127.0.0.2:22 because the ssh context is port-22-only (the
  # SshAction schema has no port field and forbids ":" in the host), so the two
  # sshd containers cannot share one address — each takes a distinct 127.x.
  sshd-pinned:
    build:
      context: ./fixtures/sshd
    image: harpoc-e2e-sshd
    volumes:
      - ./fixtures/keys/out/hostkey_pinned_ed25519:/hostkey:ro
      - ./fixtures/keys/out/authorized_keys:/authorized_keys:ro
      - ./fixtures/repos/out/clean.git:/srv-src/repo.git:ro
    # Same folding rule as the database services: uniform indentation so the
    # folded scalar joins the lines with spaces. A newline before a flag would
    # hand sshd dead text.
    command:
      - bash
      - -c
      - >-
        install -o root -g root -m 600 /hostkey /etc/ssh/ssh_host_ed25519_key &&
        install -D -o harpoc -g harpoc -m 600 /authorized_keys /home/harpoc/.ssh/authorized_keys &&
        rm -rf /srv/repo.git &&
        cp -r /srv-src/repo.git /srv/repo.git &&
        chown -R harpoc:harpoc /srv &&
        exec /usr/sbin/sshd -D -e -p 2222 -o UsePAM=no -o PasswordAuthentication=no
    ports:
      - "127.0.0.2:22:2222"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/2222"]
      interval: 2s
      timeout: 5s
      retries: 45

  # sshd-rogue answers at a DIFFERENT loopback alias with a DIFFERENT host key.
  # The mismatch arm pins the pinned server's key but connects here, so rogue's
  # real key fails host-key verification (no TOFU). Reuses the pinned image;
  # pull_policy:never keeps compose from trying to fetch the local-only tag.
  sshd-rogue:
    image: harpoc-e2e-sshd
    pull_policy: never
    volumes:
      - ./fixtures/keys/out/hostkey_rogue_ed25519:/hostkey:ro
      - ./fixtures/keys/out/authorized_keys:/authorized_keys:ro
    command:
      - bash
      - -c
      - >-
        install -o root -g root -m 600 /hostkey /etc/ssh/ssh_host_ed25519_key &&
        install -D -o harpoc -g harpoc -m 600 /authorized_keys /home/harpoc/.ssh/authorized_keys &&
        exec /usr/sbin/sshd -D -e -p 2222 -o UsePAM=no -o PasswordAuthentication=no
    ports:
      - "127.0.0.3:22:2222"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/2222"]
      interval: 2s
      timeout: 5s
      retries: 45

  # git smart-HTTP over loopback with basic auth (D2: no TLS on the git path —
  # criterion 3's handshake is the database services' job; the git arms test
  # redirect refusal, submodule denial and askpass host-binding, none of which
  # need TLS). Repos are copied out of the read-only mount and handed to www-data.
  git-http:
    build:
      context: ./fixtures/git-http
    image: harpoc-e2e-git-http
    volumes:
      - ./fixtures/repos/out:/srv-src:ro
    command:
      - bash
      - -c
      - >-
        rm -rf /srv/git &&
        cp -r /srv-src /srv/git &&
        chown -R www-data:www-data /srv/git &&
        exec apache2ctl -D FOREGROUND
    ports:
      - "127.0.0.1:55080:80"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/80"]
      interval: 2s
      timeout: 5s
      retries: 45
