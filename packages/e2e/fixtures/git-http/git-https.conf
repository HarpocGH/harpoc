# The same repositories over TLS, for the git-https arms (D12).
#
# Enabled ONLY in the `git-https` compose service (its command runs
# `a2enconf git-https`), which is the service that mounts the fixture PKI: the
# plain git-http container must keep starting with no certificate files at all,
# or a PKI problem would take the four existing green git arms down with it.
#
# The leaf is the fleet's existing echo-https certificate — SAN DNS:echo-https,
# DNS:localhost, IP:127.0.0.1 (fixtures/pki/generate.sh:87) — reused exactly as
# the `mail` service reuses it, so no new PKI artifact is issued and the arm's
# `git.ca_pem` pins the one fixture CA.
#
# The directives are repeated here rather than inherited from the server-scope
# git-http.conf: this vhost is the whole contract of the TLS publication, and a
# reader must not have to prove a merge order to know what it serves.
<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /pki/echo-https.crt
    SSLCertificateKeyFile /pki/echo-https.key

    SetEnv GIT_PROJECT_ROOT /srv/git
    SetEnv GIT_HTTP_EXPORT_ALL

    ScriptAlias /git/ /usr/lib/git-core/git-http-backend/

    <Directory "/usr/lib/git-core">
        Require all granted
    </Directory>

    <LocationMatch "^/git/">
        AuthType Basic
        AuthName "Harpoc E2E"
        AuthUserFile /etc/apache2/git-htpasswd
        Require valid-user
    </LocationMatch>
</VirtualHost>
