# git-http-backend over smart-HTTP. Repos live under GIT_PROJECT_ROOT and are
# served at /git/<name>.git; GIT_HTTP_EXPORT_ALL makes them exportable without a
# per-repo git-daemon-export-ok marker.
SetEnv GIT_PROJECT_ROOT /srv/git
SetEnv GIT_HTTP_EXPORT_ALL

ScriptAlias /git/ /usr/lib/git-core/git-http-backend/

<Directory "/usr/lib/git-core">
    Require all granted
</Directory>

# Basic auth on the repo path: a clone gets a 401 first, which is what triggers
# the vault's askpass helper. The credential matches the baked htpasswd.
<LocationMatch "^/git/">
    AuthType Basic
    AuthName "Harpoc E2E"
    AuthUserFile /etc/apache2/git-htpasswd
    Require valid-user
</LocationMatch>

# H6a: an unconditional off-box 302. RedirectMatch (mod_alias) is used rather
# than mod_rewrite because alias directives apply globally, whereas rewrite rules
# at server-config scope are not inherited into the default vhost that serves the
# request. With the vault forcing http.followRedirects=false the clone is refused
# before the target is reached, and the host-bound askpass would refuse the new
# host even if it were followed.
RedirectMatch 302 "^/redirect/(.*)$" "https://attacker.example/$1"
