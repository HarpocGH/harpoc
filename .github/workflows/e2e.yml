name: e2e
# The end-to-end evaluation harness runs apart from CI: it needs Docker and is
# Linux-only, whereas the CI suite is hermetic and runs on three platforms.
# Merging them would make the fast suite slow and the cross-platform suite
# platform-bound.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness:
    name: End-to-end evaluation harness (Linux)
    runs-on: ubuntu-latest
    # A wedged `docker compose up --wait` would otherwise burn the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Release host port 22 for the ssh backends
        # The `ssh` context is port-22-only (SshAction has no port field), so the
        # sshd containers publish on loopback aliases at :22. GitHub-hosted runners
        # keep an sshd on port 22 (socket-activated on recent Ubuntu), which the
        # alias binds collide with; the runner does not use inbound ssh for the
        # job, so releasing it is safe and scoped to this ephemeral VM.
        run: |
          echo "port 22 before:"; sudo ss -tlnp 'sport = :22' || true
          sudo systemctl stop ssh.socket ssh.service 2>/dev/null || true
          sudo fuser -k 22/tcp 2>/dev/null || true
          sleep 1
          echo "port 22 after:"; sudo ss -tlnp 'sport = :22' || true
      - name: Relax the AppArmor userns restriction for network isolation
        # The ubuntu image restricts unprivileged user namespaces via AppArmor, so
        # `unshare -rn` fails and the vault's live isolation probe reports the
        # platform cannot deliver. That is correct fail-closed behaviour — and
        # it is why the §6.2.6 network-isolation arm, which pre-registers
        # BLOCKED on Linux, observed REFUSED_UNAVAILABLE on every run of this
        # workflow before 2026-08-13 and took the leg down with it.
        #
        # ci.yml already relaxes the restriction for the integration suite; the
        # harness needs the same, or this leg measures the runner's hardening
        # rather than the vault. A warning rather than a failure: the arm itself
        # fails loudly against its pre-registration if isolation is still
        # unavailable, which is the honest place for that to surface.
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          unshare -rn -- /bin/true && echo "unshare -rn OK" || {
            echo "::warning::unshare -rn probe failed — relaxing AppArmor userns restriction"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            unshare -rn -- /bin/true && echo "unshare -rn OK after sysctl" || echo "::warning::unshare -rn still failing"
          }
      - name: Bring up the backend fleet
        # `fleet:up`, never `up`: `up` is a builtin pnpm alias for `pnpm update`,
        # which shadows a package script of the same name (review 2026-08-11, C2).
        run: pnpm --filter @harpoc/e2e fleet:up
      - name: Run the harness
        # A missing backend fails loudly inside the suite (assertFleetUp), so a
        # provisioning failure can never present as a green run.
        run: pnpm --filter @harpoc/e2e test:e2e
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: packages/e2e/evidence/run.jsonl
          if-no-files-found: warn
      - name: Fleet logs on failure
        if: failure()
        run: cd packages/e2e && docker compose logs --no-color
      - name: Tear down
        if: always()
        run: pnpm --filter @harpoc/e2e fleet:down
  two-identity:
    name: Deployment model B, two identities (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Provision the two identities with the deploy recipe (the agent user in the docker group)
        # As ci.yml's two-uid step: deploy/linux/install-two-identity.sh creates the vault
        # user harpoc, the group harpoc-clients and the directories of deployment model B; it
        # runs twice (idempotence) and the layout is checked. model-b.e2e.test.ts runs the
        # built CLI as harpoc and every agent process as harpoc-ci-agent through `sudo -n -u`.
        # The agent user joins the runner's docker group for the docker inspect row; that group
        # is root-equivalent (Docker's post-install notes), so the row measures what a container
        # and its inspect output show, not the two-identity boundary. sudo initialises the
        # groups at each exec, so the membership holds for every later `sudo -n -u`. Home
        # directories are private (0750): both users get traverse-only access to $HOME, which
        # holds the checkout; both probe the built CLI.
        run: |
          sudo useradd --create-home --shell /bin/bash harpoc-ci-agent
          sudo bash deploy/linux/install-two-identity.sh harpoc-ci-agent
          sudo bash deploy/linux/install-two-identity.sh harpoc-ci-agent
          test "$(sudo stat -c '%a %U:%G' /var/lib/harpoc /run/harpoc /run/harpoc/harpoc-ci-agent | tr '\n' ' ')" = "700 harpoc:harpoc 750 harpoc:harpoc-clients 2750 harpoc:harpoc-ci-agent "
          id -nG harpoc-ci-agent | grep -qw harpoc-clients
          sudo usermod -aG docker harpoc-ci-agent
          sudo chmod o+x "$HOME"
          for user in harpoc harpoc-ci-agent; do
            sudo -n -u "$user" -- "$(command -v node)" "$GITHUB_WORKSPACE/packages/cli/dist/index.js" --version
          done
          sudo -n -u harpoc-ci-agent -- id -nG | grep -qw docker
          sudo -n -u harpoc-ci-agent -- docker version --format '{{.Server.Version}}'
          findmnt -no OPTIONS /proc
          echo "HARPOC_TWO_UID_VAULT_USER=harpoc" >> "$GITHUB_ENV"
          echo "HARPOC_TWO_UID_AGENT_USER=harpoc-ci-agent" >> "$GITHUB_ENV"
      - name: Generate the fixture PKI and SSH keys (no fleet)
        # The suite runs its TLS echo and its SSH server in the harness process on this
        # material; the generators are dist-free.
        run: |
          pnpm --filter @harpoc/e2e pki
          pnpm --filter @harpoc/e2e keys
      - name: Pull the docker row's image
        # The tag model-b.e2e.test.ts names, pulled before the suite so the pull is outside the
        # row's deadline; no image is cached on the runner.
        run: docker pull node:22-alpine
      - name: Run the model B suite
        env:
          HARPOC_REQUIRE_PLATFORM_TESTS: two-uid,docker
        run: pnpm --filter @harpoc/e2e test:e2e src/model-b.e2e.test.ts
      - name: Upload the B evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence-b
          path: packages/e2e/evidence/run-b.jsonl
          if-no-files-found: warn
      - name: The runtime directory and the two users' processes on failure
        if: failure()
        run: |
          sudo ls -la /run/harpoc /run/harpoc/harpoc-ci-agent
          pgrep -l -u harpoc || true
          pgrep -l -u harpoc-ci-agent || true
  two-identity-windows:
    name: Deployment model B, two accounts (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        shell: pwsh
      - run: pnpm build
        shell: pwsh
      - name: Create the agent account and provision the layout with the deploy recipe
        # Windows PowerShell 5.1 (`shell: powershell`): deploy/windows/*.ps1 target it. The
        # runner's account is an administrator with the full token (the recipe's own elevation
        # check passes). The job makes both passwords here, masks them before any use, and
        # exports them through $GITHUB_ENV written without a byte-order mark; they reach the
        # suite's environment and no command line (the suite hands each to its launcher on
        # stdin). The agent is a standard local account made with New-LocalUser; the recipe
        # makes the vault account harpoc, with its password, a standard account as well. The
        # recipe runs twice (idempotence) and the layout is read back with icacls. The
        # Secondary Logon service is started explicitly: ProcessStartInfo with UserName goes
        # through CreateProcessWithLogonW.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          function Get-Index([int]$Bound) {
            $limit = [uint64]([math]::Floor(4294967296 / $Bound) * $Bound)
            $bytes = New-Object byte[] 4
            do { $rng.GetBytes($bytes); $value = [BitConverter]::ToUInt32($bytes, 0) } while ([uint64]$value -ge $limit)
            return [int]($value % $Bound)
          }
          function New-JobPassword {
            $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnopqrstuvwxyz', '23456789', '-_=+')
            $all = $sets -join ''
            $chars = New-Object System.Collections.Generic.List[char]
            foreach ($set in $sets) { $chars.Add($set[(Get-Index $set.Length)]) }
            while ($chars.Count -lt 24) { $chars.Add($all[(Get-Index $all.Length)]) }
            for ($i = $chars.Count - 1; $i -gt 0; $i--) {
              $j = Get-Index ($i + 1)
              $swap = $chars[$i]; $chars[$i] = $chars[$j]; $chars[$j] = $swap
            }
            return -join $chars
          }
          function Export-JobVariable([string]$Name, [string]$Value) {
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "$Name=$Value`n", (New-Object System.Text.UTF8Encoding($false)))
          }
          $vaultUser = 'harpoc'
          $agentUser = 'harpoc-ci-agent'
          $vaultPassword = New-JobPassword
          $agentPassword = New-JobPassword
          Write-Output "::add-mask::$vaultPassword"
          Write-Output "::add-mask::$agentPassword"
          Export-JobVariable 'HARPOC_TWO_USER_VAULT_USER' $vaultUser
          Export-JobVariable 'HARPOC_TWO_USER_AGENT_USER' $agentUser
          Export-JobVariable 'HARPOC_TWO_USER_VAULT_PASSWORD' $vaultPassword
          Export-JobVariable 'HARPOC_TWO_USER_AGENT_PASSWORD' $agentPassword
          $agentSecure = ConvertTo-SecureString -String $agentPassword -AsPlainText -Force
          New-LocalUser -Name $agentUser -Password $agentSecure -PasswordNeverExpires -UserMayNotChangePassword -AccountNeverExpires -Description 'Harpoc e2e agent account' | Out-Null
          try {
            $userSids = @(Get-LocalGroupMember -SID 'S-1-5-32-545' -ErrorAction Stop | ForEach-Object { $_.SID.Value })
          } catch {
            throw "could not list the Users group (S-1-5-32-545): $($_.Exception.GetType().FullName)"
          }
          if (-not ($userSids -contains (Get-LocalUser -Name $agentUser).SID.Value)) { Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $agentUser }
          $vaultSecure = ConvertTo-SecureString -String $vaultPassword -AsPlainText -Force
          Start-Service -Name seclogon
          Get-Service -Name seclogon | Format-Table Name, Status, StartType -AutoSize | Out-String | Write-Output
          foreach ($run in 1, 2) {
            & .\deploy\windows\install-two-identity.ps1 -AgentUser $agentUser -Password $vaultSecure
            if ($LASTEXITCODE -ne 0) { throw "install-two-identity.ps1 run $run exited $LASTEXITCODE" }
          }
          $base = Join-Path $env:ProgramData 'harpoc'
          $vaultSid = [System.Security.Principal.NTAccount]::new($env:COMPUTERNAME, $vaultUser).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $agentSid = [System.Security.Principal.NTAccount]::new($env:COMPUTERNAME, $agentUser).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $trustedSids = @($vaultSid, 'S-1-5-18', 'S-1-5-32-544')
          $consumerDir = Join-Path $base "run\$agentUser"
          foreach ($dir in $base, (Join-Path $base 'vault'), (Join-Path $base 'run'), $consumerDir) {
            $listing = (& "$env:SystemRoot\System32\icacls.exe" $dir | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "icacls exited $LASTEXITCODE on $dir" }
            Write-Output $listing
            $allowed = $trustedSids
            if ($dir -eq $consumerDir) { $allowed = $trustedSids + $agentSid }
            $acl = Get-Acl -LiteralPath $dir
            $owner = $acl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value
            if ($trustedSids -notcontains $owner) { throw "$dir is owned by $owner, outside the trusted set" }
            foreach ($rule in $acl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier])) {
              if ($rule.AccessControlType -eq 'Allow' -and $allowed -notcontains $rule.IdentityReference.Value) {
                throw "$dir grants $($rule.IdentityReference.Value), outside the trusted set"
              }
            }
          }
          $agentAcl = (& "$env:SystemRoot\System32\icacls.exe" $consumerDir | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "icacls exited $LASTEXITCODE on $consumerDir" }
          if ($agentAcl -notmatch [regex]::Escape("$agentUser`:(OI)(CI)(RX)")) { throw "the consumer directory does not grant $agentUser read and execute" }
          try {
            $adminSids = @(Get-LocalGroupMember -SID 'S-1-5-32-544' -ErrorAction Stop | ForEach-Object { $_.SID.Value })
          } catch {
            throw "could not list the Administrators group (S-1-5-32-544): $($_.Exception.GetType().FullName)"
          }
          if ($adminSids -contains $vaultSid -or $adminSids -contains $agentSid) { throw 'a test account is an administrator' }
      - name: Generate the fixture PKI and SSH keys (no fleet)
        # The suite runs its TLS echo and its SSH server in the harness process on this
        # material; the generators are dist-free and run through Git for Windows' bash.
        shell: pwsh
        run: |
          pnpm --filter @harpoc/e2e pki
          pnpm --filter @harpoc/e2e keys
      - name: Probe the native clients
        # The agent's tools are the System32 curl.exe and OpenSSH ssh.exe, by absolute path
        # (Git's usr\bin ssh is an MSYS client the vault refuses).
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\curl.exe" --version
          & "$env:SystemRoot\System32\OpenSSH\ssh.exe" -V
      - name: Run the model B Windows suite
        id: suite
        shell: pwsh
        env:
          HARPOC_REQUIRE_PLATFORM_TESTS: two-account-windows
        run: pnpm --filter @harpoc/e2e test:e2e src/model-b-windows.e2e.test.ts
      - name: Register, start and stop the daemon as a startup task (the Password-logon cell)
        # The cell of B7-U2's service model no row of the suite reaches: register-service.ps1
        # registers the real Harpoc task as the vault account harpoc (logon type Password, the
        # account's password a SecureString in this process, never on a command line), the Task
        # Scheduler starts it, and the daemon must unseal the unlock key DPAPI-sealed under that
        # account and report the vault unlocked on the health route within 60 s. The scratch
        # vault is made first as harpoc through System.Diagnostics.Process with its profile
        # loaded, as the suite's launcher does: init, then unlock-key enroll --dpapi, a fixed
        # smoke master password on each child's stdin, one line per prompt: each line flushed,
        # 2 s apart, no byte-order mark (Process.Start writes one under console code page 65001),
        # then stdin closed 2 s later (the CLI waits on it). The task is then stopped (a kill: no
        # server.stop row) and unregistered, and the scratch vault's files are removed. A red
        # here is the signal for B7-U2's fallback (a WinSW service with the same account, sealer
        # and layout), not a defect of the suite. It runs whenever the suite ran, green or red (a
        # red row does not hide the cell); a failure before the suite skips both.
        # The measurement of the cell's cause: the recipe grants the vault account Log on as a
        # batch job (SeBatchLogonRight), which a task with a stored password needs and a member
        # of Users lacks. The step prints, before and after the recipe, the logon rights
        # (secedit) and a batch logon as the account (LogonUser, logon type 4: the Win32 error
        # alone), with the Task Scheduler's operational log and the logon auditing switched on
        # first; after the start it prints the task's state and the account's 4624 / 4625
        # events, and on a red the task whole (its definition as XML, which holds no password),
        # the operational log's events for it and a control task as SYSTEM. None of these lines
        # carries a secret: the account's password stays a SecureString (an unmanaged copy for
        # LogonUser, zeroed after the call). The teardown is the recipe's own -Unregister, and the
        # scratch vault's files go as the vault account first: the session file and the sealed
        # key are owner-only to it, and the runner's own removal of them is refused (measured on
        # six runs), which would red the step after a green start.
        if: ${{ !cancelled() && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $smokeStart = Get-Date
          $vaultUser = 'harpoc'
          $vaultSecure = ConvertTo-SecureString -String $env:HARPOC_TWO_USER_VAULT_PASSWORD -AsPlainText -Force
          $vaultSid = 'unresolved'
          try { $vaultSid = [System.Security.Principal.NTAccount]::new($env:COMPUTERNAME, $vaultUser).Translate([System.Security.Principal.SecurityIdentifier]).Value } catch { Write-Output "(the vault account's SID could not be resolved; the rights lines name it unresolved: $($_.Exception.Message))" }
          $node = (Get-Command node.exe -CommandType Application | Select-Object -First 1).Source
          $cli = Join-Path $env:GITHUB_WORKSPACE 'packages\cli'
          $base = Join-Path $env:ProgramData 'harpoc'
          $vaultDir = Join-Path $base 'vault'
          $sealedKey = Join-Path $vaultDir 'unlock.key.dpapi'
          $temp = Join-Path $env:SystemRoot 'Temp'
          $smokePassword = 'b7-smoke-master-password'
          $system32 = Join-Path $env:SystemRoot 'System32'
          $taskLog = 'Microsoft-Windows-TaskScheduler/Operational'
          $logonAudit = '/subcategory:{0CCE9215-69AE-11D9-BED3-505054503030}'
          $inherited = @('ALLUSERSPROFILE', 'CommonProgramFiles', 'ComSpec', 'NUMBER_OF_PROCESSORS', 'OS', 'PATH', 'PATHEXT', 'PROCESSOR_ARCHITECTURE', 'ProgramData', 'ProgramFiles', 'ProgramFiles(x86)', 'ProgramW6432', 'PUBLIC', 'SystemDrive', 'SystemRoot', 'windir')
          try {
            Add-Type -TypeDefinition (@(
                'using System;',
                'using System.Runtime.InteropServices;',
                'public static class HarpocSmokeLogon {',
                '  [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)]',
                '  private static extern bool LogonUserW(string user, string domain, IntPtr password, int type, int provider, out IntPtr token);',
                '  [DllImport("kernel32.dll")]',
                '  private static extern bool CloseHandle(IntPtr handle);',
                '  public static int Batch(string user, IntPtr password) {',
                '    IntPtr token;',
                '    if (!LogonUserW(user, ".", password, 4, 0, out token)) return Marshal.GetLastWin32Error();',
                '    CloseHandle(token);',
                '    return 0;',
                '  }',
                '}'
              ) -join "`n")
          } catch {
            Write-Output "(the batch logon probe could not be compiled and will not run: $($_.Exception.Message))"
          }
          function Invoke-Diagnostic([string]$Title, [scriptblock]$Body) {
            Write-Output "--- $Title"
            try { & $Body } catch { Write-Output "(this diagnostic failed: $($_.Exception.Message))" }
            $global:LASTEXITCODE = 0
          }
          function Show-LogonRights {
            $cfg = Join-Path $env:RUNNER_TEMP ('harpoc-rights-' + [Guid]::NewGuid().ToString('N') + '.inf')
            & (Join-Path $system32 'secedit.exe') /export /areas USER_RIGHTS /cfg $cfg | Out-Null
            Write-Output "secedit /export exit $LASTEXITCODE; the vault account is $vaultUser, *$vaultSid"
            if (Test-Path -LiteralPath $cfg) {
              Get-Content -LiteralPath $cfg | Where-Object { $_ -match '^Se(Deny)?(Batch|Service|Interactive|Network)LogonRight\b' } | Write-Output
              Remove-Item -LiteralPath $cfg -Force
            }
          }
          function Test-BatchLogon {
            if ($null -eq ('HarpocSmokeLogon' -as [type])) { Write-Output "a batch logon (type 4) as ${vaultUser}: not probed (the logon helper did not compile)"; return }
            $password = [System.Runtime.InteropServices.Marshal]::SecureStringToGlobalAllocUnicode($vaultSecure)
            try { $code = [HarpocSmokeLogon]::Batch($vaultUser, $password) } finally { [System.Runtime.InteropServices.Marshal]::ZeroFreeGlobalAllocUnicode($password) }
            if ($code -eq 0) { Write-Output "a batch logon (type 4) as ${vaultUser}: granted" } else { Write-Output "a batch logon (type 4) as ${vaultUser}: refused, Win32 error $code (1385: the logon type is not granted; 1326: the name or the password)" }
          }
          function Show-TaskLine([string]$Name) {
            $task = Get-ScheduledTask -TaskName $Name -ErrorAction SilentlyContinue
            if ($null -eq $task) { Write-Output "task ${Name}: not registered"; return }
            $info = Get-ScheduledTaskInfo -TaskName $Name
            Write-Output ('task {0}: {1}, LastRunTime {2}, LastTaskResult 0x{3:X8}, NumberOfMissedRuns {4}, logon type {5} as {6}' -f $Name, $task.State, $info.LastRunTime, $info.LastTaskResult, $info.NumberOfMissedRuns, $task.Principal.LogonType, $task.Principal.UserId)
          }
          function Show-LogonEvents {
            $found = @(Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4624, 4625; StartTime = $smokeStart } -ErrorAction SilentlyContinue | Sort-Object TimeCreated)
            $shown = 0
            foreach ($entry in $found) {
              $data = @{}
              foreach ($item in ([xml]$entry.ToXml()).Event.EventData.Data) { $data[$item.Name] = $item.'#text' }
              if ($data['TargetUserName'] -ne $vaultUser) { continue }
              $shown++
              Write-Output ('{0:o} event {1}: logon type {2}, status {3}, sub status {4}, logon process {5}, process {6}' -f $entry.TimeCreated, $entry.Id, $data['LogonType'], $data['Status'], $data['SubStatus'], $data['LogonProcessName'], $data['ProcessName'])
            }
            Write-Output "$shown of $($found.Count) logon events since the step began name $vaultUser (4624 a logon, 4625 a refusal; type 4 is batch, 2 interactive)"
          }
          function Show-TaskEvents {
            $found = @(Get-WinEvent -FilterHashtable @{ LogName = $taskLog; StartTime = $smokeStart } -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'Harpoc' } | Sort-Object TimeCreated)
            Write-Output "$($found.Count) Task Scheduler events since the step began name Harpoc"
            foreach ($entry in $found) { Write-Output ('{0:o} event {1}: {2}' -f $entry.TimeCreated, $entry.Id, ($entry.Message -replace '\s+', ' ')) }
          }
          function Show-TaskWhole([string]$Name) {
            $task = Get-ScheduledTask -TaskName $Name
            $task | Select-Object TaskName, TaskPath, State, Author, URI | Format-List | Out-String | Write-Output
            foreach ($part in $task.Principal, $task.Settings, $task.Triggers, $task.Actions, (Get-ScheduledTaskInfo -TaskName $Name)) { $part | Format-List * | Out-String | Write-Output }
            & (Join-Path $system32 'schtasks.exe') /query /tn $Name /v /fo list
            Export-ScheduledTask -TaskName $Name | Write-Output
          }
          function Test-ControlTask {
            $control = 'HarpocSmokeControl'
            try {
              Register-ScheduledTask -TaskName $control -Action (New-ScheduledTaskAction -Execute (Join-Path $system32 'cmd.exe') -Argument '/c exit 0') -User 'NT AUTHORITY\SYSTEM' -Force | Out-Null
              Start-ScheduledTask -TaskName $control
              for ($i = 0; $i -lt 20 -and (Get-ScheduledTaskInfo -TaskName $control).LastTaskResult -eq 267011; $i++) { Start-Sleep -Milliseconds 500 }
              Show-TaskLine $control
            } finally {
              Unregister-ScheduledTask -TaskName $control -Confirm:$false -ErrorAction SilentlyContinue
            }
          }
          function Invoke-AsVaultAccount([string]$Label, [string[]]$Arguments, [string]$InputText, [switch]$Bare) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $node
            $argv = @((Join-Path $cli 'dist\index.js'), '--vault-dir', $vaultDir) + $Arguments
            if ($Bare) { $argv = $Arguments }
            $psi.Arguments = ($argv | ForEach-Object { '"' + $_ + '"' }) -join ' '
            $psi.WorkingDirectory = $base
            $psi.UserName = $vaultUser
            $psi.Domain = '.'
            $psi.Password = $vaultSecure
            $psi.LoadUserProfile = $true
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardInput = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.EnvironmentVariables.Clear()
            foreach ($name in $inherited) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if ($null -ne $value) { $psi.EnvironmentVariables[$name] = $value }
            }
            $psi.EnvironmentVariables['USERNAME'] = $vaultUser
            $psi.EnvironmentVariables['TEMP'] = $temp
            $psi.EnvironmentVariables['TMP'] = $temp
            $psi.EnvironmentVariables['HARPOC_SESSION_KEYSTORE'] = 'off'
            if ([Console]::InputEncoding.GetPreamble().Length -gt 0) { Write-Output "console input code page $([Console]::InputEncoding.CodePage): the children's stdin is written without a byte-order mark"; [Console]::InputEncoding = New-Object System.Text.UTF8Encoding($false) }
            $proc = [System.Diagnostics.Process]::Start($psi)
            $stdout = $proc.StandardOutput.ReadToEndAsync()
            $stderr = $proc.StandardError.ReadToEndAsync()
            try {
              foreach ($line in $InputText.TrimEnd("`n") -split "`n") {
                $bytes = [System.Text.Encoding]::UTF8.GetBytes($line + "`n")
                $proc.StandardInput.BaseStream.Write($bytes, 0, $bytes.Length)
                $proc.StandardInput.BaseStream.Flush()
                Start-Sleep -Seconds 2
              }
              $proc.StandardInput.Close()
            } catch { }
            if (-not $proc.WaitForExit(90000)) {
              $proc.Kill()
              try { [System.Threading.Tasks.Task]::WaitAll([System.Threading.Tasks.Task[]]@($stdout, $stderr), 5000) | Out-Null } catch { }
              foreach ($stream in $stdout, $stderr) { if ($stream.Status -eq 'RanToCompletion') { Write-Output $stream.Result } }
              throw "$Label as $vaultUser did not exit within 90 s"
            }
            Write-Output $stdout.Result
            Write-Output $stderr.Result
            if ($proc.ExitCode -ne 0) { throw "$Label as $vaultUser exited $($proc.ExitCode)" }
          }
          $failure = $null
          $leftover = $false
          try {
            Invoke-AsVaultAccount 'init' @('init') "$smokePassword`n$smokePassword`n"
            Invoke-AsVaultAccount 'unlock-key enroll --dpapi' @('unlock-key', 'enroll', '--out', $sealedKey, '--dpapi') "$smokePassword`n"
            Invoke-Diagnostic "the step's own account (whoami /all)" { & (Join-Path $system32 'whoami.exe') /all }
            Invoke-Diagnostic "the Task Scheduler's operational log, switched on before the registration" {
              & (Join-Path $system32 'wevtutil.exe') sl $taskLog /e:true
              Write-Output "wevtutil sl exit $LASTEXITCODE"
              & (Join-Path $system32 'wevtutil.exe') gl $taskLog | Select-Object -First 2
            }
            Invoke-Diagnostic 'the logon auditing (4624 / 4625), as found and then switched on' {
              & (Join-Path $system32 'auditpol.exe') /get $logonAudit
              & (Join-Path $system32 'auditpol.exe') /set $logonAudit /success:enable /failure:enable
            }
            Invoke-Diagnostic 'the logon rights before the recipe' { Show-LogonRights }
            Invoke-Diagnostic 'a batch logon before the recipe' { Test-BatchLogon }
            $global:LASTEXITCODE = 0
            & .\deploy\windows\register-service.ps1 -Node $node -Cli $cli -Password $vaultSecure
            if ($LASTEXITCODE -ne 0) { throw "register-service.ps1 exited $LASTEXITCODE" }
            Invoke-Diagnostic 'the logon rights after the recipe' { Show-LogonRights }
            Invoke-Diagnostic 'a batch logon after the recipe' { Test-BatchLogon }
            Start-ScheduledTask -TaskName Harpoc
            $state = 'no answer'
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            while ([DateTime]::UtcNow -lt $deadline) {
              try {
                $state = (Invoke-RestMethod -Uri 'http://127.0.0.1:3000/api/v1/health' -UseBasicParsing -TimeoutSec 5).data.state
              } catch {
                $state = 'no answer'
              }
              if ($state -eq 'unlocked') { break }
              Start-Sleep -Seconds 1
            }
            Write-Output "health: $state"
            Invoke-Diagnostic 'the task after the start' { Show-TaskLine 'Harpoc' }
            Invoke-Diagnostic "the vault account's logon events" { Show-LogonEvents }
            if ($state -ne 'unlocked') {
              Invoke-Diagnostic "the Task Scheduler's events for the task" { Show-TaskEvents }
              Invoke-Diagnostic 'the task whole' { Show-TaskWhole 'Harpoc' }
              Invoke-Diagnostic 'a control task as SYSTEM (does the Task Scheduler launch anything here)' { Test-ControlTask }
              Get-NetTCPConnection -LocalPort 3000 -State Listen -ErrorAction SilentlyContinue | Select-Object LocalAddress, OwningProcess | Format-Table -AutoSize | Out-String | Write-Output
              Get-Process -Name node -ErrorAction SilentlyContinue | Select-Object Id, ProcessName | Format-Table -AutoSize | Out-String | Write-Output
              throw 'the Harpoc task did not report the vault unlocked within 60 s'
            }
            Stop-ScheduledTask -TaskName Harpoc
            $stopDeadline = [DateTime]::UtcNow.AddSeconds(30)
            while ((Get-ScheduledTask -TaskName Harpoc).State -eq 'Running' -and [DateTime]::UtcNow -lt $stopDeadline) { Start-Sleep -Seconds 1 }
            if ((Get-ScheduledTask -TaskName Harpoc).State -eq 'Running') { throw 'the Harpoc task still read Running 30 s after Stop-ScheduledTask, before the second registration' }
            $global:LASTEXITCODE = 0
            $rerunWriter = New-Object System.IO.StringWriter
            $consoleOut = [Console]::Out
            [Console]::SetOut($rerunWriter)
            try {
              & .\deploy\windows\register-service.ps1 -Node $node -Cli $cli -Password $vaultSecure
              $rerunExit = $LASTEXITCODE
            } finally {
              [Console]::SetOut($consoleOut)
              $rerunOutput = $rerunWriter.ToString()
              Write-Output '--- the recipe run a second time, the vault account holding the right'
              Write-Output $rerunOutput
            }
            if ($rerunExit -ne 0) { throw "register-service.ps1 run a second time exited $rerunExit" }
            if (-not $rerunOutput.Contains("right SeBatchLogonRight (Log on as a batch job) already held by $env:COMPUTERNAME\$vaultUser")) { throw "register-service.ps1 run a second time did not print that $env:COMPUTERNAME\$vaultUser already holds SeBatchLogonRight" }
            Invoke-Diagnostic 'the task after the second registration' { Show-TaskLine 'Harpoc' }
          } catch {
            $failure = $_
          } finally {
            Stop-ScheduledTask -TaskName Harpoc -ErrorAction SilentlyContinue
            try {
              $global:LASTEXITCODE = 0
              & .\deploy\windows\register-service.ps1 -Unregister
              if ($LASTEXITCODE -ne 0) { throw "register-service.ps1 -Unregister exited $LASTEXITCODE" }
            } catch {
              Write-Output "the teardown of the task and the right failed: $($_.Exception.Message)"
              if ($null -eq $failure) { $failure = $_ }
            }
            Unregister-ScheduledTask -TaskName Harpoc -Confirm:$false -ErrorAction SilentlyContinue
            Invoke-Diagnostic 'the logon rights after the teardown' { Show-LogonRights }
            $scratch = 'default.vault.db', 'default.vault.db-wal', 'default.vault.db-shm', 'session.json', 'unlock.key.dpapi'
            try {
              Invoke-AsVaultAccount 'the scratch vault removal' (@('-e', "for (const file of process.argv.slice(1)) require('node:fs').rmSync(file, { force: true, maxRetries: 5, retryDelay: 100 })") + @($scratch | ForEach-Object { Join-Path $vaultDir $_ })) '' -Bare
            } catch {
              Write-Output "the scratch vault removal as $vaultUser failed: $($_.Exception.Message)"
            }
            foreach ($name in $scratch) {
              $path = Join-Path $vaultDir $name
              for ($attempt = 1; Test-Path -LiteralPath $path; $attempt++) {
                try {
                  Remove-Item -LiteralPath $path -Force
                } catch {
                  if ($attempt -ge 20) {
                    Write-Output "could not remove $path"
                    $leftover = $true
                    break
                  }
                  Start-Sleep -Milliseconds 500
                }
              }
            }
          }
          if ($null -ne $failure) { throw $failure }
          if ($leftover) { throw 'the scratch vault left files behind (listed above)' }
          $global:LASTEXITCODE = 0
      - name: Measure the enrolment recipe's launch as the vault account from this step and from a one-shot task (read-outs only)
        # A measurement, not a check: the step prints five read-outs and fails only when one of
        # them cannot be read; it asserts no value. The expectations, written before the first
        # run: from this step the recipe's own launch form - Start-Process with the vault
        # account's credential and -LoadUserProfile -Wait -PassThru on node -e "process.exit(0)"
        # - exits 0 (step-launch-exit=0); from a one-shot scheduled task's batch logon the same
        # form exits -1073741502, 0xC0000142 (task-launch-exit=-1073741502);
        # [Environment]::UserInteractive is read in both sessions (step-interactive=,
        # task-interactive=); and deploy/windows/enroll-unlock-key.ps1, run in that task in
        # process with Get-Credential shadowed by a function returning the vault account's
        # credential as <machine>\harpoc, under a 120 s bound, exits 1 with its named 0xC0000142
        # message (task-recipe-exit=1, the message among the task's lines). A launch read-out of
        # unread means the launch was made but Windows PowerShell 5.1 could not read the ended
        # child's exit code (its Process object never took the handle); it fails nothing. A launch
        # that throws is recorded as threw (the exception's type and message are printed beside
        # it). The task runs as this step's own account, an administrator, with logon type S4U (a
        # batch logon that stores no password) at run level Highest: the recipe checks elevation.
        # The vault account's password is the provisioning step's masked one, read from the
        # environment into a SecureString as the task smoke step reads it and removed from this
        # process's environment before any launch; it reaches the task over a named pipe whose
        # access list admits this account alone, byte by byte from an unmanaged copy zeroed after
        # the write - never on a command line, in the log or in a file. The task's script and its
        # read-outs sit in a directory under RUNNER_TEMP whose access list admits this account
        # alone, and neither holds a password. The recipe's -Out names a new file carrying the
        # run's GUID that the CLI never reaches (it prompts first). The finally removes the task
        # on every path, then a CLI the recipe left running past the bound (its command line
        # carries the GUID) and the directory.
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $vaultUser = 'harpoc'
          $vaultSecure = $null
          if (-not [string]::IsNullOrEmpty($env:HARPOC_TWO_USER_VAULT_PASSWORD)) { $vaultSecure = ConvertTo-SecureString -String $env:HARPOC_TWO_USER_VAULT_PASSWORD -AsPlainText -Force }
          Remove-Item -Path 'Env:HARPOC_TWO_USER_VAULT_PASSWORD', 'Env:HARPOC_TWO_USER_AGENT_PASSWORD' -ErrorAction SilentlyContinue
          $stepLaunchExit = 'missing'
          $taskLaunchExit = 'missing'
          $stepInteractive = 'missing'
          $taskInteractive = 'missing'
          $taskRecipeExit = 'missing'
          $node = (Get-Command node.exe -CommandType Application | Select-Object -First 1).Source
          $base = Join-Path $env:ProgramData 'harpoc'
          $cli = Join-Path $env:GITHUB_WORKSPACE 'packages\cli'
          $recipe = Join-Path $env:GITHUB_WORKSPACE 'deploy\windows\enroll-unlock-key.ps1'
          $guid = [Guid]::NewGuid().ToString('N')
          $taskName = "HarpocMeasure-$guid"
          $pipeName = "harpoc-measure-$guid"
          $work = Join-Path $env:RUNNER_TEMP "harpoc-measure-$guid"
          $results = Join-Path $work 'readouts.txt'
          $taskScript = Join-Path $work 'measure.ps1'
          $out = Join-Path $base "vault\harpoc-measure-$guid.key.dpapi"
          $me = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          function ConvertTo-Literal([string]$Value) { return "'" + $Value.Replace("'", "''") + "'" }
          function Test-TaskDone {
            try { return (Test-Path -LiteralPath $results) -and (@(Get-Content -LiteralPath $results) -contains 'task-done') } catch { return $false }
          }
          $taskText = @'
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $results = __RESULTS__
          function Write-Readout([string]$Text) { [System.IO.File]::AppendAllText($results, "$Text`n", (New-Object System.Text.UTF8Encoding($false))) }
          try {
            Write-Readout "task-interactive=$([Environment]::UserInteractive)"
            $secure = New-Object System.Security.SecureString
            $client = New-Object System.IO.Pipes.NamedPipeClientStream('.', __PIPE__, [System.IO.Pipes.PipeDirection]::In)
            $pair = New-Object byte[] 2
            try {
              $client.Connect(60000)
              while ($client.Read($pair, 0, 1) -eq 1 -and $client.Read($pair, 1, 1) -eq 1) { $secure.AppendChar([char]([int]$pair[0] -bor ([int]$pair[1] -shl 8))) }
            } finally {
              [Array]::Clear($pair, 0, 2)
              $client.Dispose()
            }
            $secure.MakeReadOnly()
            $credential = New-Object System.Management.Automation.PSCredential("$([Environment]::MachineName)\harpoc", $secure)
            try {
              $process = Start-Process -FilePath __NODE__ -ArgumentList '-e "process.exit(0)"' -Credential $credential -LoadUserProfile -WorkingDirectory __BASE__ -Wait -PassThru
              if ($null -eq $process.ExitCode) { Write-Readout 'task-launch-exit=unread' } else { Write-Readout "task-launch-exit=$($process.ExitCode)" }
            } catch {
              Write-Readout 'task-launch-exit=threw'
              Write-Readout "the launch from the task threw $($_.Exception.GetType().FullName): $($_.Exception.Message)"
            }
            $runspace = [runspacefactory]::CreateRunspace()
            $runspace.Open()
            $runspace.SessionStateProxy.SetVariable('HarpocMeasureCredential', $credential)
            $shell = [PowerShell]::Create()
            $shell.Runspace = $runspace
            [void]$shell.AddScript((@(
                'param($Recipe, $Node, $Cli, $Out)',
                'function Get-Credential { $global:HarpocMeasureCredential }',
                '$global:LASTEXITCODE = 0',
                'try { & $Recipe -Node $Node -Cli $Cli -Out $Out; "exit $global:LASTEXITCODE" } catch { "uncaught $($_.Exception.GetType().FullName)" }'
              ) -join "`n"))
            [void]$shell.AddParameter('Recipe', __RECIPE__).AddParameter('Node', __NODE__).AddParameter('Cli', __CLI__).AddParameter('Out', __OUT__)
            $recipeOut = New-Object System.IO.StringWriter
            $recipeError = New-Object System.IO.StringWriter
            $consoleOut = [Console]::Out
            $consoleError = [Console]::Error
            [Console]::SetOut($recipeOut)
            [Console]::SetError($recipeError)
            try {
              $async = $shell.BeginInvoke()
              if ($async.AsyncWaitHandle.WaitOne(120000)) {
                $ends = @($shell.EndInvoke($async))
                Write-Readout "task-recipe-exit=$((@($ends) | Select-Object -Last 1) -replace '^exit ', '')"
              } else {
                [void]$shell.BeginStop($null, $null)
                Write-Readout 'task-recipe-exit=timeout (120 s)'
              }
            } finally {
              [Console]::SetOut($consoleOut)
              [Console]::SetError($consoleError)
            }
            foreach ($row in ($recipeOut.ToString() -split "`r?`n")) { if ($row -ne '') { Write-Readout "the recipe's stdout: $row" } }
            foreach ($row in ($recipeError.ToString() -split "`r?`n")) { if ($row -ne '') { Write-Readout "the recipe's stderr: $row" } }
          } catch {
            Write-Readout "the task's script stopped early: $($_.Exception.GetType().FullName): $($_.Exception.Message)"
          } finally {
            Write-Readout 'task-done'
          }
          '@
          $taskText = $taskText.Replace('__RESULTS__', (ConvertTo-Literal $results)).Replace('__PIPE__', (ConvertTo-Literal $pipeName)).Replace('__NODE__', (ConvertTo-Literal $node)).Replace('__BASE__', (ConvertTo-Literal $base)).Replace('__RECIPE__', (ConvertTo-Literal $recipe)).Replace('__CLI__', (ConvertTo-Literal $cli)).Replace('__OUT__', (ConvertTo-Literal $out))
          $stepInteractive = [string][Environment]::UserInteractive
          if ($null -eq $vaultSecure) {
            Write-Output "(the vault account's password is not in this step's environment - the provisioning step exports it; nothing is launched)"
          } else {
            $credential = New-Object System.Management.Automation.PSCredential("$([Environment]::MachineName)\$vaultUser", $vaultSecure)
            try {
              $process = Start-Process -FilePath $node -ArgumentList '-e "process.exit(0)"' -Credential $credential -LoadUserProfile -WorkingDirectory $base -Wait -PassThru
              if ($null -eq $process.ExitCode) { $stepLaunchExit = 'unread' } else { $stepLaunchExit = [string]$process.ExitCode }
            } catch {
              $stepLaunchExit = 'threw'
              Write-Output "(the launch from this step threw $($_.Exception.GetType().FullName): $($_.Exception.Message))"
            }
            $server = $null
            try {
              $workSecurity = New-Object System.Security.AccessControl.DirectorySecurity
              $workSecurity.SetAccessRuleProtection($true, $false)
              $workSecurity.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($me.User, 'FullControl', 'ContainerInherit, ObjectInherit', 'None', 'Allow')))
              [void][System.IO.Directory]::CreateDirectory($work, $workSecurity)
              [System.IO.File]::WriteAllText($taskScript, $taskText, (New-Object System.Text.UTF8Encoding($false)))
              $pipeSecurity = New-Object System.IO.Pipes.PipeSecurity
              $pipeSecurity.SetAccessRuleProtection($true, $false)
              $pipeSecurity.AddAccessRule((New-Object System.IO.Pipes.PipeAccessRule($me.User, 'FullControl', 'Allow')))
              $server = New-Object System.IO.Pipes.NamedPipeServerStream($pipeName, [System.IO.Pipes.PipeDirection]::Out, 1, [System.IO.Pipes.PipeTransmissionMode]::Byte, [System.IO.Pipes.PipeOptions]::Asynchronous, 0, 0, $pipeSecurity)
              $action = New-ScheduledTaskAction -Execute (Join-Path $PSHOME 'powershell.exe') -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$taskScript`""
              $principal = New-ScheduledTaskPrincipal -UserId $me.Name -LogonType S4U -RunLevel Highest
              $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 5)
              Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Settings $settings | Out-Null
              Start-ScheduledTask -TaskName $taskName
              $connect = $server.WaitForConnectionAsync()
              if (-not $connect.Wait(90000)) { throw 'the task did not open the pipe within 90 s' }
              $unmanaged = [System.Runtime.InteropServices.Marshal]::SecureStringToGlobalAllocUnicode($vaultSecure)
              try {
                for ($i = 0; $i -lt $vaultSecure.Length; $i++) {
                  $unit = [System.Runtime.InteropServices.Marshal]::ReadInt16($unmanaged, 2 * $i)
                  $server.WriteByte([byte]($unit -band 0xFF))
                  $server.WriteByte([byte](($unit -shr 8) -band 0xFF))
                }
                $unit = 0
                $server.Flush()
                $server.WaitForPipeDrain()
              } finally {
                [System.Runtime.InteropServices.Marshal]::ZeroFreeGlobalAllocUnicode($unmanaged)
              }
              $server.Dispose()
              $server = $null
              $deadline = [DateTime]::UtcNow.AddSeconds(240)
              while ([DateTime]::UtcNow -lt $deadline -and -not (Test-TaskDone)) { Start-Sleep -Seconds 2 }
              if (-not (Test-TaskDone)) { Write-Output '(the task did not finish within 240 s)' }
            } catch {
              Write-Output "(the task's measurement stopped early: $($_.Exception.GetType().FullName): $($_.Exception.Message))"
            } finally {
              if ($null -ne $server) { $server.Dispose() }
              try {
                $info = Get-ScheduledTaskInfo -TaskName $taskName
                Write-Output ('the one-shot task: LastRunTime {0}, LastTaskResult 0x{1:X8}, logon type S4U as {2}, run level Highest' -f $info.LastRunTime, $info.LastTaskResult, $me.Name)
              } catch {
                Write-Output "(the one-shot task's state could not be read: $($_.Exception.GetType().FullName))"
              }
              Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
              Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
              if ($null -eq (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue)) { Write-Output "the one-shot task $taskName is removed" } else { Write-Output "::warning::the one-shot task $taskName is still registered" }
              Get-CimInstance -ClassName Win32_Process -Filter "Name = 'node.exe'" -ErrorAction SilentlyContinue | Where-Object { $null -ne $_.CommandLine -and $_.CommandLine.Contains($guid) } | ForEach-Object {
                Write-Output "stopping the recipe's CLI left running past the bound (process $($_.ProcessId))"
                Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
              }
              try {
                if (Test-Path -LiteralPath $results) {
                  foreach ($row in @(Get-Content -LiteralPath $results)) {
                    if ($row -match '^task-launch-exit=(.+)$') { $taskLaunchExit = $Matches[1] }
                    elseif ($row -match '^task-interactive=(.+)$') { $taskInteractive = $Matches[1] }
                    elseif ($row -match '^task-recipe-exit=(.+)$') { $taskRecipeExit = $Matches[1] }
                    elseif ($row -ne 'task-done') { Write-Output "task: $row" }
                  }
                } else {
                  Write-Output '(the task wrote no read-outs)'
                }
              } catch {
                Write-Output "(the task's read-outs could not be read: $($_.Exception.GetType().FullName))"
              }
              Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Output "step-launch-exit=$stepLaunchExit"
          Write-Output "task-launch-exit=$taskLaunchExit"
          Write-Output "step-interactive=$stepInteractive"
          Write-Output "task-interactive=$taskInteractive"
          Write-Output "task-recipe-exit=$taskRecipeExit"
          if (@($stepLaunchExit, $taskLaunchExit, $stepInteractive, $taskInteractive, $taskRecipeExit) -contains 'missing') { throw 'a read-out is missing (its line above reads missing)' }
          $global:LASTEXITCODE = 0
      - name: Run e2e's Windows unit files (no fleet)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: pnpm --filter @harpoc/e2e test:e2e src/assert/process-inventory-windows.test.ts src/harness/runas-windows.test.ts src/harness/two-identity-windows.test.ts src/harness/fixtures.test.ts
      - name: Upload the B Windows evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence-b-windows
          path: packages/e2e/evidence/run-b-windows.jsonl
          if-no-files-found: warn
      - name: The runtime directory, the accounts and their processes on failure
        if: failure()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\icacls.exe" (Join-Path $env:ProgramData 'harpoc\run')
          & "$env:SystemRoot\System32\icacls.exe" (Join-Path $env:ProgramData 'harpoc\run\harpoc-ci-agent')
          Get-ChildItem -Force (Join-Path $env:ProgramData 'harpoc\run\harpoc-ci-agent') | Select-Object Name, Length | Format-Table -AutoSize
          Get-Service -Name seclogon | Format-Table Name, Status, StartType -AutoSize
          Get-LocalUser | Select-Object Name, Enabled | Format-Table -AutoSize
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'harpoc-b7' -or $_.Name -in 'curl.exe', 'ssh.exe', 'node.exe' } | Select-Object ProcessId, Name | Format-Table -AutoSize
          Get-ScheduledTask -TaskName Harpoc -ErrorAction SilentlyContinue | Select-Object TaskName, State | Format-Table -AutoSize
          $global:LASTEXITCODE = 0
