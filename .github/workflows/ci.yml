name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Enable Linux keystore tiers and the bwrap isolation tier (keyutils + Secret Service + bubblewrap)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y keyutils gnome-keyring libsecret-tools dbus-x11 bubblewrap
      - name: Provision the two identities (Linux, the two-uid tier) with the deploy recipe
        if: runner.os == 'Linux'
        # deploy/linux/install-two-identity.sh creates the vault user harpoc, the
        # group harpoc-clients and the directories of deployment model B; it runs
        # twice (idempotence) and the layout is checked. two-identity.test.ts then
        # runs the built CLI as harpoc and probes it as harpoc-ci-agent through
        # `sudo -n -u` (the runner's sudo is passwordless). ubuntu-22.04+ home
        # directories are private (0750), so both users get traverse-only access to
        # $HOME, which holds the checkout; the node probe fails this step if either
        # user cannot read it.
        run: |
          sudo useradd --create-home --shell /bin/bash harpoc-ci-agent
          sudo bash deploy/linux/install-two-identity.sh harpoc-ci-agent
          sudo bash deploy/linux/install-two-identity.sh harpoc-ci-agent
          test "$(sudo stat -c '%a %U:%G' /var/lib/harpoc /run/harpoc /run/harpoc/harpoc-ci-agent | tr '\n' ' ')" = "700 harpoc:harpoc 750 harpoc:harpoc-clients 2750 harpoc:harpoc-ci-agent "
          id -nG harpoc-ci-agent | grep -qw harpoc-clients
          sudo chmod o+x "$HOME"
          for user in harpoc harpoc-ci-agent; do
            sudo -n -u "$user" -- "$(command -v node)" -e "require('node:fs').accessSync(process.argv[1])" "$GITHUB_WORKSPACE/package.json"
          done
          echo "HARPOC_TWO_UID_VAULT_USER=harpoc" >> "$GITHUB_ENV"
          echo "HARPOC_TWO_UID_AGENT_USER=harpoc-ci-agent" >> "$GITHUB_ENV"
      - name: Probe Linux keystores (diagnostic)
        if: runner.os == 'Linux'
        run: |
          which keyctl secret-tool || true
          keyctl link @u @s || echo "::warning::keyctl link @u @s failed"
          echo 746573746b6579 | keyctl padd user harpoc-ci-probe @u || echo "::warning::kernel keyring probe failed"
          keyctl search @u user harpoc-ci-probe || true
          keyctl purge user harpoc-ci-probe || true
      - name: Grant bwrap user namespaces through a targeted AppArmor profile (node 22 leg - the operator's second route)
        if: runner.os == 'Linux' && matrix.node-version == 22
        # The node 24 leg relaxes the global sysctl (next step) and so
        # exercises `unshare` for the network tier; this leg grants `userns`
        # to /usr/bin/bwrap alone, so `unshare -rn` keeps failing and the vault
        # takes bwrap for the network tier and for the combined demand (the
        # filesystem tier alone takes setpriv's Landlock where util-linux has
        # it - the probe step below prints which) - the second tier's live
        # proof, and the route getting-started.md documents for operators who
        # will not relax the restriction host-wide.
        # 2026-11-06: ubuntu-latest moved to a newer ubuntu image and
        # the bare profile stopped working there (bwrap: loopback: Failed
        # RTM_NEWADDR: Operation not permitted - the loopback setup inside the
        # new network namespace lost CAP_NET_ADMIN under the image's AppArmor).
        # The step now prints the image's kernel, AppArmor and bubblewrap
        # versions and the bwrap profiles the image loads, disables a
        # distribution profile attached to /usr/bin/bwrap (it would shadow
        # ours), grants the profile the capabilities and netlink access the
        # namespace setup needs, re-probes, and - only if bwrap still fails -
        # falls back to the node 24 leg's sysctl route with a warning, so the
        # leg stays green and the log says which route it took.
        run: |
          uname -r
          dpkg-query -W -f='${Package} ${Version}\n' apparmor bubblewrap 2>/dev/null || true
          grep -i bwrap /sys/kernel/security/apparmor/profiles || echo "no bwrap profile loaded by the image"
          for f in /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/bwrap /etc/apparmor.d/usr.bin.bwrap; do
            if [ -f "$f" ]; then
              sudo apparmor_parser -R "$f" || true
              sudo mkdir -p /etc/apparmor.d/disable && sudo ln -sf "$f" /etc/apparmor.d/disable/
              echo "disabled the distribution profile $f"
            fi
          done
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile harpoc-bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '  capability,' '  network,' '  mount,' '  umount,' '  pivot_root,' '}' | sudo tee /etc/apparmor.d/harpoc-bwrap >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/harpoc-bwrap
          grep -i bwrap /sys/kernel/security/apparmor/profiles || true
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          unshare -rn -- /bin/true && echo "::warning::unshare -rn passes on this leg - the bwrap network tier will not be exercised" || echo "unshare -rn refused (expected on this leg)"
          if bwrap --dev-bind / / --unshare-net --die-with-parent -- /bin/true; then
            echo "bwrap --unshare-net OK under the profile"
          else
            echo "::warning::bwrap --unshare-net failed under the profile on this image - falling back to the sysctl route (the bwrap tier is not exercised on this leg)"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            bwrap --dev-bind / / --unshare-net --die-with-parent -- /bin/true && echo "bwrap --unshare-net OK after the sysctl" || echo "::warning::bwrap --unshare-net still failing after the sysctl"
            unshare -rn -- /bin/true && echo "unshare -rn OK after the sysctl" || echo "::warning::unshare -rn still failing after the sysctl"
          fi
      - name: Probe network isolation (diagnostic; relaxes the userns restriction on the node 24 leg)
        if: runner.os == 'Linux' && matrix.node-version == 24
        # The ubuntu image restricts unprivileged user namespaces via AppArmor
        # (apparmor_restrict_unprivileged_userns). The suite's live probe
        # skips gracefully either way; this step surfaces the real error so
        # a skipped leg is diagnosable from the log. If it reports denial,
        # relax the restriction for the runner:
        #   sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        # The node 22 leg takes the targeted-profile route instead (previous step).
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          unshare -rn -- /bin/true && echo "unshare -rn OK" || {
            echo "::warning::unshare -rn probe failed — relaxing AppArmor userns restriction"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            unshare -rn -- /bin/true && echo "unshare -rn OK after sysctl" || echo "::warning::unshare -rn still failing"
          }
      - name: Probe filesystem isolation (diagnostic - setpriv Landlock or bwrap)
        if: runner.os == 'Linux'
        # util-linux before 2.40 has no `setpriv --landlock-*`; there the
        # filesystem tier is bubblewrap's read-only root bind under the userns
        # grant the step above arranged, and with a newer util-linux on a
        # Landlock kernel the vault takes setpriv first — this step prints which.
        # "fs-isolation" is REQUIRED on this leg, so a warning from a tier in
        # use foretells a test failure below. The argv are byte-identical to
        # LANDLOCK_PREFIX_ARGS, BWRAP_FS_PREFIX_ARGS and
        # BWRAP_COMBINED_PREFIX_ARGS in packages/core/src/injection/.
        # Diagnostic only: never fails.
        run: |
          setpriv --version || true
          setpriv --landlock-access fs --landlock-rule path-beneath:execute,read-file,read-dir:/ --landlock-rule path-beneath:write-file:/dev/null -- /bin/true && echo "setpriv Landlock OK" || echo "::notice::setpriv Landlock unavailable (util-linux before 2.40 or no Landlock)"
          bwrap --version || true
          bwrap --ro-bind / / --dev /dev --die-with-parent -- /bin/true && echo "bwrap read-only root OK" || echo "::warning::bwrap filesystem probe failed"
          bwrap --ro-bind / / --dev /dev --unshare-net --die-with-parent -- /bin/true && echo "bwrap combined OK" || echo "::warning::bwrap combined probe failed"
      - name: Probe network isolation (diagnostic)
        if: runner.os == 'macOS'
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)' /usr/bin/true && echo "sandbox-exec OK" || echo "::warning::sandbox-exec probe failed"
      - name: Probe filesystem isolation (diagnostic)
        if: runner.os == 'macOS'
        # Both profiles are byte-identical to SANDBOX_EXEC_DENY_WRITE_PROFILE
        # and SANDBOX_EXEC_DENY_NETWORK_AND_WRITE_PROFILE in
        # packages/core/src/injection/fs-isolation.ts — they are what the
        # vault's own live probes run. The "fs-isolation" tier is REQUIRED on
        # this leg, so a warning here foretells a test failure below.
        run: |
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny file-write*)(allow file-write-data (literal "/dev/null"))' /usr/bin/true && echo "sandbox-exec deny-write OK" || echo "::warning::sandbox-exec deny-write probe failed"
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)(deny file-write*)(allow file-write-data (literal "/dev/null"))' /usr/bin/true && echo "sandbox-exec deny-network+write OK" || echo "::warning::sandbox-exec combined probe failed"
      - name: Provision disposable unlocked macOS test keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p harpoc-ci harpoc-ci.keychain
          security unlock-keychain -p harpoc-ci harpoc-ci.keychain
          security set-keychain-settings harpoc-ci.keychain
          echo "HARPOC_TEST_KEYCHAIN=$HOME/Library/Keychains/harpoc-ci.keychain-db" >> "$GITHUB_ENV"
      - run: pnpm install
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      # The leg's first DPAPI protect under the gate measured 5-36 s on every
      # Windows row from 2026-09-10 to 2026-09-14 and 0.6-0.9 s on every leg whose
      # probe step had run before the gate; probe P (run 34862717372, 2026-09-14)
      # isolated the call: the bare host's legs at 1412 / 1332 ms (attempt 2;
      # 3334 ms on attempt 1's Node 22 leg) against the standing legs' 8387 /
      # 19128 ms (decisions.md § "Concurrency, warm-up and register tranche
      # (2026-09-14, third) — rulings", D2/D3). The call's own duration is
      # printed for the record; nothing is asserted.
      - name: Warm-up before the gate (Windows)
        if: runner.os == 'Windows'
        run: node .github/scripts/pregate-warmup.mjs
      - name: Test (Windows, native OpenSSH client required for the ssh-live tier)
        if: runner.os == 'Windows'
        env:
          HARPOC_REQUIRE_PLATFORM_TESTS: ssh-live
          HARPOC_SERIES_FILE: ${{ runner.temp }}/harpoc-series.md
        run: pnpm test
      # The three CI series lines (the listing warm-up, the two DPAPI cases)
      # reach the job summary and this file; the summary renders only for a
      # signed-in browser and no API returns it, so the file is uploaded and
      # harvested with `gh run download` (decisions.md § "Listing probe and
      # series artifact tranche (2026-09-09) — rulings", D5).
      - name: Upload the CI series lines (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: series-${{ matrix.os }}-${{ matrix.node-version }}
          path: ${{ runner.temp }}/harpoc-series.md
          if-no-files-found: ignore
          retention-days: 30
      # HARPOC_REQUIRE_PLATFORM_TESTS turns a failed availability probe on a
      # provisioned tier into a test FAILURE instead of a silent skip — a
      # regressed provisioning step above must not drop real-path coverage to
      # zero while the leg stays green (review T3).
      # --concurrency=1 serializes the per-package test suites: the macOS
      # runners have 7 GB against 16 GB on ubuntu/windows, and the real-Argon2id
      # suites (integration at maxWorkers 2 = 4 GiB peak, the cli compiled-binary
      # smoke, core's KAT) running concurrently across packages under turbo
      # swamp the host — per-package maxWorkers caps do not compose across
      # packages. The starvation showed up as roaming collateral timeouts
      # (oauth-proxy hooks, scaffold imports, rest-api rate-limit timing).
      - name: Test (macOS, keychain + sandbox-exec tiers required)
        if: runner.os == 'macOS'
        env:
          HARPOC_REQUIRE_PLATFORM_TESTS: keychain,isolation,fs-isolation,ssh-live
        # No "--" before the flag: pnpm's arg separator would route it through
        # turbo's pass-through to vitest, which rejects it.
        run: pnpm test --concurrency=1
      - name: Test (Linux, D-Bus session with unlocked keyring - required Secret Service/keyring/isolation/fs-isolation)
        if: runner.os == 'Linux'
        # keyctl link @u @s grants the CI shell possession of the user keyring
        # (non-login processes lack the pam_keyinit link, so @u operations get
        # EACCES without it); gnome-keyring provides the Secret Service.
        env:
          HARPOC_REQUIRE_PLATFORM_TESTS: secret-service,keyring,isolation,fs-isolation,ssh-live,two-uid,systemd-creds
        run: dbus-run-session -- sh -c 'echo harpoc-ci | gnome-keyring-daemon --unlock; keyctl link @u @s || true; pnpm test'
      - run: pnpm format:check
