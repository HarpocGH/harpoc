name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Enable Linux keystore tiers (keyutils + Secret Service)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y keyutils gnome-keyring libsecret-tools dbus-x11
      - name: Probe Linux keystores (diagnostic)
        if: runner.os == 'Linux'
        run: |
          which keyctl secret-tool || true
          keyctl link @u @s || echo "::warning::keyctl link @u @s failed"
          echo 746573746b6579 | keyctl padd user harpoc-ci-probe @u || echo "::warning::kernel keyring probe failed"
          keyctl search @u user harpoc-ci-probe || true
          keyctl purge user harpoc-ci-probe || true
      - name: "R7 probe (diagnostic, temporary): bwrap tiers on ubuntu-24.04 - stock, after the sysctl relax, under a targeted AppArmor profile"
        if: runner.os == 'Linux'
        # Wave 3 step 9 / Task 1 (implementation-plan-compromise-wave3-isolation-r7-2026-09-04.md).
        # Every line is diagnostic; the step never fails the leg. The "R7 "
        # lines in the log are the record; Task 6 removes this step and turns
        # the findings into the leg's real provisioning.
        run: |
          set +e
          sudo apt-get install -y bubblewrap
          echo "R7 bwrap version: $(bwrap --version 2>&1)"
          echo "R7 sysctl: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>&1)"
          form() {
            label="$1"; shift
            bwrap "$@" -- /bin/true; echo "R7 $label true (expect 0): $?"
            bwrap "$@" -- /bin/sh -c 'exit 7'; echo "R7 $label exit propagation (expect 7): $?"
          }
          forms() {
            form "network" --bind / / --unshare-net --die-with-parent
            form "fs" --ro-bind / / --dev /dev --die-with-parent
            form "combined" --ro-bind / / --dev /dev --unshare-net --die-with-parent
            bwrap --ro-bind / / --dev /dev --die-with-parent -- /bin/sh -c 'echo x > /dev/null'; echo "R7 fs /dev/null write (expect 0): $?"
            rm -f "$HOME/r7-probe-marker"
            bwrap --ro-bind / / --dev /dev --die-with-parent -- /bin/sh -c "echo x > $HOME/r7-probe-marker"; echo "R7 fs host-dir write (expect non-zero): $?"
            if [ -e "$HOME/r7-probe-marker" ]; then echo "R7 fs marker: PRESENT (bad)"; rm -f "$HOME/r7-probe-marker"; else echo "R7 fs marker: absent (good)"; fi
            bwrap --bind / / --unshare-net --die-with-parent -- /bin/sh -c 'cat /proc/net/dev' | sed 's/^/R7 netns view: /'
            bwrap --bind / / --unshare-net --die-with-parent -- /bin/sleep 300 &
            monitor=$!
            sleep 1
            echo "R7 kill chain: sleep pids before kill: $(pgrep -x sleep | tr '\n' ' ')"
            kill -KILL "$monitor"
            sleep 1
            if pgrep -x sleep >/dev/null; then echo "R7 kill chain: FAILED (sleep survived)"; pkill -KILL -x sleep; else echo "R7 kill chain: OK (payload gone with the monitor)"; fi
          }
          echo "R7 ===== pass 1: stock ====="
          forms
          echo "R7 ===== pass 2: after sysctl kernel.apparmor_restrict_unprivileged_userns=0 ====="
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          forms
          echo "R7 ===== pass 3: sysctl back to 1, targeted profile for /usr/bin/bwrap ====="
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile harpoc-bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' | sudo tee /etc/apparmor.d/harpoc-bwrap >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/harpoc-bwrap; echo "R7 profile load (expect 0): $?"
          unshare -rn -- /bin/true; echo "R7 unshare under the profile route (expect non-zero): $?"
          forms
          sudo apparmor_parser -R /etc/apparmor.d/harpoc-bwrap
          sudo rm -f /etc/apparmor.d/harpoc-bwrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          exit 0
      - name: Probe network isolation (diagnostic)
        if: runner.os == 'Linux'
        # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor
        # (apparmor_restrict_unprivileged_userns). The suite's live probe
        # skips gracefully either way; this step surfaces the real error so
        # a skipped leg is diagnosable from the log. If it reports denial,
        # relax the restriction for the runner:
        #   sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          unshare -rn -- /bin/true && echo "unshare -rn OK" || {
            echo "::warning::unshare -rn probe failed — relaxing AppArmor userns restriction"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            unshare -rn -- /bin/true && echo "unshare -rn OK after sysctl" || echo "::warning::unshare -rn still failing"
          }
      - name: Probe filesystem isolation (diagnostic — expected unavailable on ubuntu-24.04)
        if: runner.os == 'Linux'
        # ubuntu-24.04 (today's ubuntu-latest image) ships util-linux 2.39,
        # whose `setpriv` has no `--landlock-*` options, so filesystem
        # isolation cannot be delivered on this leg: "fs-isolation" is
        # deliberately ABSENT from this leg's HARPOC_REQUIRE_PLATFORM_TESTS
        # and the suite's live probe skips the enforcement describe. Add the
        # tier below once the runner image carries util-linux >= 2.40
        # (Ubuntu 24.10+/Debian 13+) — the argv is already kernel-verified
        # (debian trixie, util-linux 2.41). The fail-closed refusal path is
        # ungated and runs here regardless. Diagnostic only: never fails.
        run: |
          setpriv --version || true
          setpriv --landlock-access fs --landlock-rule path-beneath:execute,read-file,read-dir:/ --landlock-rule path-beneath:write-file:/dev/null -- /bin/true && echo "setpriv Landlock OK" || echo "::notice::setpriv Landlock unavailable (expected on util-linux 2.39)"
      - name: Probe network isolation (diagnostic)
        if: runner.os == 'macOS'
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)' /usr/bin/true && echo "sandbox-exec OK" || echo "::warning::sandbox-exec probe failed"
      - name: Probe filesystem isolation (diagnostic)
        if: runner.os == 'macOS'
        # Both profiles are byte-identical to SANDBOX_EXEC_DENY_WRITE_PROFILE
        # and SANDBOX_EXEC_DENY_NETWORK_AND_WRITE_PROFILE in
        # packages/core/src/injection/fs-isolation.ts — they are what the
        # vault's own live probes run. The "fs-isolation" tier is REQUIRED on
        # this leg, so a warning here foretells a test failure below.
        run: |
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny file-write*)' /usr/bin/true && echo "sandbox-exec deny-write OK" || echo "::warning::sandbox-exec deny-write probe failed"
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)(deny file-write*)' /usr/bin/true && echo "sandbox-exec deny-network+write OK" || echo "::warning::sandbox-exec combined probe failed"
      - name: "R7 probe (diagnostic, temporary): the sandbox-exec /dev/null allow clause, two spellings, under node and sh"
        if: runner.os == 'macOS'
        # Wave 3 step 9 / Task 1. Diagnostic only; removed by Task 6.
        run: |
          set +e
          marker="$RUNNER_TEMP/r7-probe-marker"
          for clause in '(allow file-write-data (literal "/dev/null"))' '(allow file-write* (literal "/dev/null"))'; do
            for base in '(version 1)(allow default)(deny file-write*)' '(version 1)(allow default)(deny network*)(deny file-write*)'; do
              profile="${base}${clause}"
              echo "R7 profile: $profile"
              /usr/bin/sandbox-exec -p "$profile" /usr/bin/true; echo "R7   true (expect 0): $?"
              /usr/bin/sandbox-exec -p "$profile" node -e 'try { require("node:fs").writeFileSync("/dev/null", "x"); process.exit(0); } catch { process.exit(7); }'; echo "R7   node writeFileSync /dev/null (expect 0): $?"
              /usr/bin/sandbox-exec -p "$profile" /bin/sh -c 'echo x > /dev/null'; echo "R7   sh echo > /dev/null (expect 0): $?"
              rm -f "$marker"
              /usr/bin/sandbox-exec -p "$profile" node -e 'try { require("node:fs").writeFileSync(process.argv[1], "x"); process.exit(0); } catch { process.exit(7); }' "$marker"; echo "R7   node writeFileSync temp file (expect 7): $?"
              if [ -e "$marker" ]; then echo "R7   marker: PRESENT (bad)"; rm -f "$marker"; else echo "R7   marker: absent (good)"; fi
            done
          done
          exit 0
      - name: Provision disposable unlocked macOS test keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p harpoc-ci harpoc-ci.keychain
          security unlock-keychain -p harpoc-ci harpoc-ci.keychain
          security set-keychain-settings harpoc-ci.keychain
          echo "HARPOC_TEST_KEYCHAIN=$HOME/Library/Keychains/harpoc-ci.keychain-db" >> "$GITHUB_ENV"
      - run: pnpm install
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Test (Windows, native OpenSSH client required for the ssh-live tier)
        if: runner.os == 'Windows'
        env:
          HARPOC_REQUIRE_PLATFORM_TESTS: ssh-live
        run: pnpm test
      # HARPOC_REQUIRE_PLATFORM_TESTS turns a failed availability probe on a
      # provisioned tier into a test FAILURE instead of a silent skip — a
      # regressed provisioning step above must not drop real-path coverage to
      # zero while the leg stays green (review T3).
      # --concurrency=1 serializes the per-package test suites: the macOS
      # runners have 7 GB against 16 GB on ubuntu/windows, and the real-Argon2id
      # suites (integration at maxWorkers 2 = 4 GiB peak, the cli compiled-binary
      # smoke, core's KAT) running concurrently across packages under turbo
      # swamp the host — per-package maxWorkers caps do not compose across
      # packages. The starvation showed up as roaming collateral timeouts
      # (oauth-proxy hooks, scaffold imports, rest-api rate-limit timing).
      - name: Test (macOS, keychain + sandbox-exec tiers required)
        if: runner.os == 'macOS'
        env:
          HARPOC_REQUIRE_PLATFORM_TESTS: keychain,isolation,fs-isolation,ssh-live
        # No "--" before the flag: pnpm's arg separator would route it through
        # turbo's pass-through to vitest, which rejects it.
        run: pnpm test --concurrency=1
      - name: Test (Linux, D-Bus session with unlocked keyring — required Secret Service/keyring/isolation)
        if: runner.os == 'Linux'
        # keyctl link @u @s grants the CI shell possession of the user keyring
        # (non-login processes lack the pam_keyinit link, so @u operations get
        # EACCES without it); gnome-keyring provides the Secret Service.
        env:
          HARPOC_REQUIRE_PLATFORM_TESTS: secret-service,keyring,isolation,ssh-live
        run: dbus-run-session -- sh -c 'echo harpoc-ci | gnome-keyring-daemon --unlock; keyctl link @u @s || true; pnpm test'
      - run: pnpm format:check
