name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Enable Linux keystore tiers and the bwrap isolation tier (keyutils + Secret Service + bubblewrap)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y keyutils gnome-keyring libsecret-tools dbus-x11 bubblewrap
      - name: Probe Linux keystores (diagnostic)
        if: runner.os == 'Linux'
        run: |
          which keyctl secret-tool || true
          keyctl link @u @s || echo "::warning::keyctl link @u @s failed"
          echo 746573746b6579 | keyctl padd user harpoc-ci-probe @u || echo "::warning::kernel keyring probe failed"
          keyctl search @u user harpoc-ci-probe || true
          keyctl purge user harpoc-ci-probe || true
      - name: Grant bwrap user namespaces through a targeted AppArmor profile (node 22 leg - the operator's second route)
        if: runner.os == 'Linux' && matrix.node-version == 22
        # The node 24 leg relaxes the global sysctl (next step) and so
        # exercises `unshare` for the network tier; this leg grants `userns`
        # to /usr/bin/bwrap alone, so `unshare -rn` keeps failing and the vault
        # falls to bwrap for BOTH dimensions - the second tier's live proof,
        # and the route getting-started.md documents for operators who will
        # not relax the restriction host-wide. Verified by the step 9 probe
        # (implementation-plan-compromise-wave3-isolation-r7-2026-09-04.md).
        run: |
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile harpoc-bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' | sudo tee /etc/apparmor.d/harpoc-bwrap >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/harpoc-bwrap
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          unshare -rn -- /bin/true && echo "::warning::unshare -rn passes on this leg - the bwrap network tier will not be exercised" || echo "unshare -rn refused (expected on this leg)"
          bwrap --bind / / --unshare-net --die-with-parent -- /bin/true && echo "bwrap --unshare-net OK under the profile" || echo "::warning::bwrap --unshare-net failed under the profile"
      - name: Probe network isolation (diagnostic; relaxes the userns restriction on the node 24 leg)
        if: runner.os == 'Linux' && matrix.node-version == 24
        # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor
        # (apparmor_restrict_unprivileged_userns). The suite's live probe
        # skips gracefully either way; this step surfaces the real error so
        # a skipped leg is diagnosable from the log. If it reports denial,
        # relax the restriction for the runner:
        #   sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        # The node 22 leg takes the targeted-profile route instead (previous step).
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          unshare -rn -- /bin/true && echo "unshare -rn OK" || {
            echo "::warning::unshare -rn probe failed — relaxing AppArmor userns restriction"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            unshare -rn -- /bin/true && echo "unshare -rn OK after sysctl" || echo "::warning::unshare -rn still failing"
          }
      - name: Probe filesystem isolation (diagnostic - setpriv expected unavailable on ubuntu-24.04, bwrap expected OK)
        if: runner.os == 'Linux'
        # ubuntu-24.04 (today's ubuntu-latest image) ships util-linux 2.39,
        # whose `setpriv` has no `--landlock-*` options; the filesystem tier on
        # this leg is delivered by bubblewrap's read-only root bind (the second
        # tier, Wave 3 step 9) under the userns grant the step above arranged.
        # "fs-isolation" is REQUIRED on this leg, so a bwrap warning here
        # foretells a test failure below. The argv are byte-identical to
        # LANDLOCK_PREFIX_ARGS, BWRAP_FS_PREFIX_ARGS and
        # BWRAP_COMBINED_PREFIX_ARGS in packages/core/src/injection/.
        # Diagnostic only: never fails.
        run: |
          setpriv --version || true
          setpriv --landlock-access fs --landlock-rule path-beneath:execute,read-file,read-dir:/ --landlock-rule path-beneath:write-file:/dev/null -- /bin/true && echo "setpriv Landlock OK" || echo "::notice::setpriv Landlock unavailable (expected on util-linux 2.39)"
          bwrap --version || true
          bwrap --ro-bind / / --dev /dev --die-with-parent -- /bin/true && echo "bwrap read-only root OK" || echo "::warning::bwrap filesystem probe failed"
          bwrap --ro-bind / / --dev /dev --unshare-net --die-with-parent -- /bin/true && echo "bwrap combined OK" || echo "::warning::bwrap combined probe failed"
      - name: Probe network isolation (diagnostic)
        if: runner.os == 'macOS'
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)' /usr/bin/true && echo "sandbox-exec OK" || echo "::warning::sandbox-exec probe failed"
      - name: Probe filesystem isolation (diagnostic)
        if: runner.os == 'macOS'
        # Both profiles are byte-identical to SANDBOX_EXEC_DENY_WRITE_PROFILE
        # and SANDBOX_EXEC_DENY_NETWORK_AND_WRITE_PROFILE in
        # packages/core/src/injection/fs-isolation.ts — they are what the
        # vault's own live probes run. The "fs-isolation" tier is REQUIRED on
        # this leg, so a warning here foretells a test failure below.
        run: |
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny file-write*)(allow file-write-data (literal "/dev/null"))' /usr/bin/true && echo "sandbox-exec deny-write OK" || echo "::warning::sandbox-exec deny-write probe failed"
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)(deny file-write*)(allow file-write-data (literal "/dev/null"))' /usr/bin/true && echo "sandbox-exec deny-network+write OK" || echo "::warning::sandbox-exec combined probe failed"
      - name: Provision disposable unlocked macOS test keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p harpoc-ci harpoc-ci.keychain
          security unlock-keychain -p harpoc-ci harpoc-ci.keychain
          security set-keychain-settings harpoc-ci.keychain
          echo "HARPOC_TEST_KEYCHAIN=$HOME/Library/Keychains/harpoc-ci.keychain-db" >> "$GITHUB_ENV"
      - run: pnpm install
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Test (Windows, native OpenSSH client required for the ssh-live tier)
        if: runner.os == 'Windows'
        env:
          HARPOC_REQUIRE_PLATFORM_TESTS: ssh-live
        run: pnpm test
      # HARPOC_REQUIRE_PLATFORM_TESTS turns a failed availability probe on a
      # provisioned tier into a test FAILURE instead of a silent skip — a
      # regressed provisioning step above must not drop real-path coverage to
      # zero while the leg stays green (review T3).
      # --concurrency=1 serializes the per-package test suites: the macOS
      # runners have 7 GB against 16 GB on ubuntu/windows, and the real-Argon2id
      # suites (integration at maxWorkers 2 = 4 GiB peak, the cli compiled-binary
      # smoke, core's KAT) running concurrently across packages under turbo
      # swamp the host — per-package maxWorkers caps do not compose across
      # packages. The starvation showed up as roaming collateral timeouts
      # (oauth-proxy hooks, scaffold imports, rest-api rate-limit timing).
      - name: Test (macOS, keychain + sandbox-exec tiers required)
        if: runner.os == 'macOS'
        env:
          HARPOC_REQUIRE_PLATFORM_TESTS: keychain,isolation,fs-isolation,ssh-live
        # No "--" before the flag: pnpm's arg separator would route it through
        # turbo's pass-through to vitest, which rejects it.
        run: pnpm test --concurrency=1
      - name: Test (Linux, D-Bus session with unlocked keyring - required Secret Service/keyring/isolation/fs-isolation)
        if: runner.os == 'Linux'
        # keyctl link @u @s grants the CI shell possession of the user keyring
        # (non-login processes lack the pam_keyinit link, so @u operations get
        # EACCES without it); gnome-keyring provides the Secret Service.
        env:
          HARPOC_REQUIRE_PLATFORM_TESTS: secret-service,keyring,isolation,fs-isolation,ssh-live
        run: dbus-run-session -- sh -c 'echo harpoc-ci | gnome-keyring-daemon --unlock; keyctl link @u @s || true; pnpm test'
      - run: pnpm format:check
