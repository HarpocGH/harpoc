name: Release
# A `v*` tag publishes the GitHub release for the commit it points at. The job
# refuses a tag without a versioned notes file and a tag whose commit ci.yml has
# not already proven green (the six-leg matrix is the gate; nothing is re-run
# here on a stock runner that lacks the Linux keystore, userns and bubblewrap
# setup ci.yml performs), builds the tagged tree once, and publishes the notes
# file as the release body.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the release notes for this tag
        run: |
          notes=".github/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::no release notes at $notes - write them before tagging"
            exit 1
          fi
      - name: Require a green ci.yml run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --json status,conclusion \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
          if [ "${green:-0}" -lt 1 ]; then
            echo "::error::no green ci.yml run for $GITHUB_SHA - push the commit to main and let CI pass before tagging it"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: .github/releases/${{ github.ref_name }}.md
          make_latest: "true"
