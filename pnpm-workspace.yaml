packages:
  - "packages/*"

strictPeerDependencies: true

# pnpm 10.x (the pinned packageManager) reads onlyBuiltDependencies; pnpm 11 removed
# that key for allowBuilds and turns an undecided build script into a failed install
# (ERR_PNPM_IGNORED_BUILDS), so every package with an install script needs a verdict.
# esbuild, cpu-features and ssh2 have had their scripts skipped since v1.0 with CI green:
# esbuild gets its binary from the platform package, cpu-features and ssh2 (a core
# test-only dependency) are optional native accelerators with pure-JS fallbacks.
# better-sqlite3 13 (2026-10-07) ships its prebuilt binaries inside the tarball
# (prebuilds/<platform>-<arch>.node, loaded when build/Release is absent) and declares
# `gypfile: false`; pnpm's lifecycle runner does not read that flag and would inject
# `node-gyp rebuild` for its binding.gyp — a from-source build that needs Visual Studio
# on Windows — so its verdict is false too.
onlyBuiltDependencies:
  - argon2
allowBuilds:
  argon2: true
  better-sqlite3: false
  cpu-features: false
  esbuild: false
  ssh2: false

# minimatch 11.0.1 closes GHSA-g3hv-75wg-m249 (>=7.0.0 <11.0.1, moderate; 2026-11-06); eslint 10.14,
# @eslint/config-array and @typescript-eslint/typescript-estree still declare ^10.2.6, so the floor
# stands here until they move to 11 (then this block goes).
overrides:
  minimatch: ^11.0.1
